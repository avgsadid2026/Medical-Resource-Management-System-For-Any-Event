services:
  postgres:
    image: postgres:16-alpine
    container_name: emrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emrms_db
    ports:
      - "5432:5432"
    volumes:
      - emrms_pgdata:/var/lib/postgresql/data

volumes:
  emrms_pgdata:
